<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PD GIS Pro - Ban QLDA Phương Đông</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0a0f1d; color: #fff; }
        #map { width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .sidebar { transition: transform 0.3s ease-in-out; z-index: 1000; }
        .sidebar.collapsed { transform: translateX(-100%); }
        .layer-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.08); transition: background 0.2s; cursor: pointer; }
        .layer-item:hover { background: rgba(255,255,255,0.05); }
        .hud-overlay { z-index: 900; pointer-events: none; }
        .hud-interactive { pointer-events: auto; }
    </style>
</head>
<body>

    <!-- LỚP NỀN MỜ KHI MỞ MENU TRÊN DI ĐỘNG -->
    <div id="sidebarBackdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-[950] hidden md:hidden"></div>

    <!-- THANH MENU TRÁI (QUẢN LÝ CÁC LỚP & HỆ THỐNG) -->
    <div id="sidebar" class="sidebar collapsed fixed top-0 left-0 h-full w-[85vw] max-w-xs bg-slate-900/95 backdrop-blur-md shadow-2xl flex flex-col border-r border-slate-700">
        <!-- Header Menu -->
        <div class="bg-indigo-900 px-4 py-3 flex items-center justify-between border-b border-indigo-800">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-layer-group text-yellow-400 text-lg"></i>
                <span class="font-bold text-sm tracking-wide">QUẢN LÝ CÁC LỚP & TIỆN ÍCH</span>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="toggleSidebar()" class="text-slate-300 hover:text-white p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto text-xs divide-y divide-slate-800">

            <div class="p-3 bg-slate-800/50">
                <div class="font-bold text-blue-400 mb-2 flex items-center space-x-2">
                    <i class="fa-solid fa-earth-asia"></i><span>HỆ CHIẾU VN-2000</span>
                </div>
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <button class="bg-blue-600 hover:bg-blue-500 py-1.5 px-2 rounded text-center font-semibold">Cấp 34 Tỉnh</button>
                    <button class="bg-slate-700 hover:bg-slate-600 py-1.5 px-2 rounded text-center text-slate-300">63 Tỉnh</button>
                </div>
                <select class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-slate-200">
                    <option>Lâm Đồng - Bình Thuận - Đắk Nông</option>
                </select>
            </div>

            <!-- Camera AR & Khảo sát -->
            <div class="p-3 bg-slate-800/30">
                <button class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 px
